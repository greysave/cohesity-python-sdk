[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohesity-rest-helper"
version = "0.1.0"
description = "Authentication and REST helper classes for querying Cohesity cluster protection and storage stats."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "pandas>=2.0"]
license = { text = "Apache-2.0" }
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: Apache Software License"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7", "ruff", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "examples"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
